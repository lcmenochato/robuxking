name: Replace site with ZIP
on:
  push:
    paths:
      - '.github/workflows/replace-from-zip.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace repository with archive contents
        shell: bash
        run: |
          set -euo pipefail
          test -f robuxking-clean.zip
          mkdir -p /tmp/robuxking-extracted
          unzip -q robuxking-clean.zip -d /tmp/robuxking-extracted
          test -f /tmp/robuxking-extracted/robuxking/index.html
          test -f /tmp/robuxking-extracted/robuxking/api/worker.js
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a /tmp/robuxking-extracted/robuxking/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace repository with robuxking-clean ZIP" || exit 0
          git push
